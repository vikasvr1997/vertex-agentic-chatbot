name: 42Crunch API Security Audit

on:
  push:
    branches: [main]
    paths:
      - "src/agentic_chatbot/api/**"
      - "openapi/**"
  pull_request:
    branches: [main]
    paths:
      - "src/agentic_chatbot/api/**"
      - "openapi/**"

permissions:
  contents: read

jobs:
  api-security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Regenerate OpenAPI spec and fail on drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi/openapi.yaml

      # Requires a 42Crunch platform account and API token stored as the
      # CRUNCH42_API_TOKEN repo secret: https://docs.42crunch.com/
      - name: 42Crunch API Security Audit
        uses: 42Crunch/api-security-audit-action@v3
        with:
          api-token: ${{ secrets.CRUNCH42_API_TOKEN }}
          data-file: openapi/openapi.yaml
          min-score: "75"
