openapi: 3.1.0
info:
  title: Agentic Chatbot API
  description: "Internal backend for an enterprise conversational agent. Connects\
    \ to Vertex AI exclusively via Application Default Credentials \u2014 no API keys\
    \ are accepted or stored."
  version: 0.1.0
paths:
  /chat:
    post:
      tags:
      - chat
      summary: Send Chat Message
      operationId: send_chat_message_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    ChatRequest:
      properties:
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Omit to start a new session.
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        reply:
          type: string
          title: Reply
        turn_count:
          type: integer
          title: Turn Count
      type: object
      required:
      - session_id
      - reply
      - turn_count
      title: ChatResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        environment:
          type: string
          title: Environment
      type: object
      required:
      - status
      - environment
      title: HealthResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
