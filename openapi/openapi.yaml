openapi: 3.1.0
info:
  title: Agentic Chatbot API
  description: "Internal backend for an enterprise conversational agent. Connects\
    \ to Vertex AI exclusively via Application Default Credentials \u2014 no API keys\
    \ are accepted or stored."
  version: 0.1.0
paths:
  /chat:
    post:
      tags:
      - chat
      summary: Send Chat Message
      operationId: send_chat_message_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /status:
    get:
      tags:
      - ops
      summary: Get Status
      operationId: get_status_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      security:
      - HTTPBearer: []
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    ChatRequest:
      properties:
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Omit to start a new session.
        settings:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Settings
          description: 'Optional per-request overrides, e.g. {''model'': ''gemini-2.0-flash-001''}.
            A model override only takes effect when starting a brand-new session.'
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        reply:
          type: string
          title: Reply
        turn_count:
          type: integer
          title: Turn Count
        generated_query:
          anyOf:
          - type: string
          - type: 'null'
          title: Generated Query
          description: SQL generated by the BigQuery agent, if this turn was routed
            there.
        table:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Table
          description: Rows returned by the generated query, if any.
        chart:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Chart
          description: 'Chart spec: {type, x, y, title, x_label, y_label}.'
      type: object
      required:
      - session_id
      - reply
      - turn_count
      title: ChatResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        environment:
          type: string
          title: Environment
      type: object
      required:
      - status
      - environment
      title: HealthResponse
    StatusResponse:
      properties:
        google_cloud_project:
          type: string
          title: Google Cloud Project
        google_cloud_location:
          type: string
          title: Google Cloud Location
        vertex_model_name:
          type: string
          title: Vertex Model Name
        backend_mode:
          type: string
          title: Backend Mode
        bigquery_dataset:
          anyOf:
          - type: string
          - type: 'null'
          title: Bigquery Dataset
      type: object
      required:
      - google_cloud_project
      - google_cloud_location
      - vertex_model_name
      - backend_mode
      - bigquery_dataset
      title: StatusResponse
      description: Non-secret configuration surfaced to the frontends' sidebar/settings
        UI.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
