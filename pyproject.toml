[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Enterprise conversational agentic chatbot backed by Vertex AI (ADC-only), with Streamlit and Chainlit frontends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vikas Reddy Bodireddy" }]

dependencies = [
  "google-cloud-aiplatform>=1.70.0",
  "google-cloud-bigquery>=3.25.0",
  "google-auth>=2.34.0",
  "vertexai>=1.70.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.52.4",
  "streamlit>=1.38.0",
  "chainlit>=1.3.0",
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "plotly>=5.24.0",
  "pandas>=2.2.0",
  # devtools.architecture_flow_tool — dev-only debugging page mounted on the backend.
  "dash>=2.18.0",
  "dash-cytoscape>=1.0.2",
  "a2wsgi>=1.10.6",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pre-commit>=3.8.0",
  "pyyaml>=6.0.2",
  "types-PyYAML>=6.0.12",
]
# Only needed when LLM_BACKEND=claude (see core.vertex_client.ClaudeModelBackend).
claude = [
  "anthropic>=0.68.0",
  # core.auth.get_secret needs this to fetch the Claude key from Secret Manager.
  "google-cloud-secret-manager>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_chatbot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored single-file dev tool — its own module docstring explains why it's
# self-contained and not meant to be edited; exclude it from lint/format so
# a pre-commit run never rewrites someone else's reference implementation.
extend-exclude = ["src/agentic_chatbot/devtools/architecture_flow_tool.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends() default-arg pattern is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["agentic_chatbot"]

[tool.mypy]
python_version = "3.12"
packages = ["agentic_chatbot"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Vendored single-file dev tool (see its own module docstring for why it's
# self-contained and not meant to be edited) — exempt from this project's
# stricter annotation requirements rather than reformatting someone else's
# reference implementation to satisfy them.
[[tool.mypy.overrides]]
module = "agentic_chatbot.devtools.architecture_flow_tool"
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=agentic_chatbot --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/agentic_chatbot"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
